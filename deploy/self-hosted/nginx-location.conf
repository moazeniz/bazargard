# Bazargard under a sub-path of an existing nginx server block.
# Include inside `server { ... }` (deploy/self-hosted/install.sh inserts it before `location / {`).
# The frontend is built with relative asset URLs (vite base './'), so any prefix works.
# Set PUBLIC_BASE_URL=http(s)://<HOST>/hamrah/ in the app environment to match.
    location = /hamrah { return 302 /hamrah/; }
    location /hamrah/ {
        proxy_pass http://127.0.0.1:8506/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat answers stream/poll for minutes; do not buffer or cut them off.
        proxy_buffering off;
        proxy_read_timeout 600s;
        client_max_body_size 4m;   # photo search uploads up to ~3 MB
    }
