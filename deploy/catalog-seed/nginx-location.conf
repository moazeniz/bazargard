# Token-protected download of the catalogue seed for Liara first boot (backend/start.py).
# Put inside any nginx server block reachable from Liara's (Iranian) runtime. The token lives only in
# /etc/nginx/catalog-seed-token.conf (mode 600), one line:
#   if ($http_authorization != "Bearer <CATALOG_TOKEN>") { return 401; }
# scripts/publish-catalog-seed.sh creates both files.
    location = /liara-data/catalog.db.gz {
        include /etc/nginx/catalog-seed-token.conf;
        alias /srv/liara-data/catalog.db.gz;
        default_type application/gzip;
        access_log off;
    }
